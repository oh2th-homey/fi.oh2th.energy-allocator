<form class="homey-form">
  <h1 class="homey-title">Select devices</h1>
  <p class="homey-subtitle">
    Select one or more devices that expose an energy counter. You'll pick which
    counter(s) to use on the next screen. Your current selection is checked.
  </p>

  <div class="homey-form-group">
    <label class="homey-form-label" for="ea-search">Filter</label>
    <input class="homey-form-input" type="text" id="ea-search" placeholder="Filter by name or zone…" />
  </div>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend">Devices</legend>
    <div id="ea-list"></div>
  </fieldset>
</form>

<script type="text/javascript">
  // No in-page "Next" button: this view's manifest entry has a
  // navigation.next, so Homey's own pairing chrome renders the Continue
  // button. Selected ids are kept current with the driver on every checkbox
  // change instead of waiting for a click we don't control. Checked state
  // survives re-filtering because it's tracked here, not just read from the DOM.
  let DEVICES = [];
  const CHECKED = new Set();

  function label(device) {
    return device.zone ? `${device.name} (${device.zone})` : device.name;
  }

  function sendSelection() {
    Homey.emit('select_source_devices', Array.from(CHECKED)).catch((err) => Homey.alert(err.message || err));
  }

  function renderList(filterText) {
    const list = document.getElementById('ea-list');
    const term = (filterText || '').trim().toLowerCase();
    const shown = DEVICES.filter((device) => !term || label(device).toLowerCase().includes(term));

    list.innerHTML = '';
    if (shown.length === 0) {
      list.innerHTML = '<p class="homey-subtitle">No matching devices.</p>';
      return;
    }

    for (const device of shown) {
      const row = document.createElement('label');
      row.className = 'homey-form-checkbox';
      row.innerHTML = ''
        + `<input class="homey-form-checkbox-input" type="checkbox" value="${device.id}" />`
        + '<span class="homey-form-checkbox-checkmark"></span>'
        + '<span class="homey-form-checkbox-text"></span>';
      row.querySelector('.homey-form-checkbox-text').textContent = label(device);

      const input = row.querySelector('input');
      input.checked = CHECKED.has(device.id);
      input.addEventListener('change', () => {
        if (input.checked) CHECKED.add(device.id);
        else CHECKED.delete(device.id);
        sendSelection();
      });
      list.appendChild(row);
    }
  }

  document.getElementById('ea-search').addEventListener('input', (e) => renderList(e.target.value));

  Homey.showLoadingOverlay();
  Homey.emit('list_source_devices', null)
    .then((devices) => {
      DEVICES = devices || [];
      for (const device of DEVICES) {
        if (device.selected) CHECKED.add(device.id);
      }
      Homey.hideLoadingOverlay();
      renderList('');
      sendSelection(); // record the pre-seeded current selection right away
    })
    .catch((err) => {
      Homey.hideLoadingOverlay();
      Homey.alert(err.message || err);
    });
</script>
