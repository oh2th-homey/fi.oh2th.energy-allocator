<style type="text/css">
  /* Homey Style Library has no scrollable-list primitive; this is the only
     layout rule not covered by a homey-* class. */
  .ea-scroll { max-height: 50vh; overflow-y: auto; }
</style>

<form class="homey-form">
  <h1 class="homey-title">Select counters</h1>
  <p class="homey-subtitle" id="ea-hint">Choose which energy counter(s) to add.</p>

  <div class="ea-scroll" id="ea-groups"></div>

  <button class="homey-button-primary-full" type="button" id="ea-add" disabled>Add</button>
</form>

<script type="text/javascript">
  let MODE = 'individual';

  function makeUid() {
    // Makes `data` unique even when the same deviceId+capability is paired
    // more than once, or across several counters summed into one device -
    // allowed, since one counter can feed several allocators for different
    // purposes.
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function updateAddState() {
    const anyChecked = document.querySelectorAll('#ea-groups input:checked').length > 0;
    document.getElementById('ea-add').disabled = !anyChecked;
  }

  function applyModeText() {
    document.getElementById('ea-hint').textContent = MODE === 'summary'
      ? 'Choose which energy counter(s) to sum into one summary device.'
      : 'Choose which energy counter(s) to add. Each one becomes its own allocator device.';
    document.getElementById('ea-add').textContent = MODE === 'summary' ? 'Add summary device' : 'Add devices';
  }

  function renderGroups(groups) {
    const container = document.getElementById('ea-groups');
    container.innerHTML = '';

    if (!groups || groups.length === 0) {
      container.innerHTML = '<p class="homey-subtitle">No energy counters found on the selected devices.</p>';
      return;
    }

    for (const group of groups) {
      const title = group.zone ? `${group.name} (${group.zone})` : group.name;

      const fieldset = document.createElement('fieldset');
      fieldset.className = 'homey-form-checkbox-set';
      fieldset.innerHTML = '<legend class="homey-form-checkbox-set-title"></legend>';
      fieldset.querySelector('legend').textContent = title;

      for (const cap of group.capabilities) {
        const row = document.createElement('label');
        row.className = 'homey-form-checkbox';
        row.innerHTML = ''
          + '<input class="homey-form-checkbox-input" type="checkbox" />'
          + '<span class="homey-form-checkbox-checkmark"></span>'
          + '<span class="homey-form-checkbox-text"></span>';
        row.querySelector('.homey-form-checkbox-text').textContent = cap.title;

        const input = row.querySelector('input');
        input.dataset.deviceId = group.deviceId;
        input.dataset.capability = cap.id;
        input.dataset.name = group.multiple ? `${title} (${cap.title}) allocation` : `${title} allocation`;
        input.addEventListener('change', updateAddState);

        fieldset.appendChild(row);
      }
      container.appendChild(fieldset);
    }
  }

  document.getElementById('ea-add').addEventListener('click', async () => {
    const checked = Array.from(document.querySelectorAll('#ea-groups input:checked'));
    if (checked.length === 0) return;

    Homey.showLoadingOverlay();
    try {
      // Counter selection goes in `store` (mutable - `onRepair` can change it
      // later); `data` only carries the immutable identity: `uid` and the
      // fixed pairing `mode`.
      if (MODE === 'summary') {
        const counters = checked.map((input) => ({
          deviceId: input.dataset.deviceId,
          capability: input.dataset.capability,
        }));
        await Homey.createDevice({
          name: 'Summary allocation',
          data: { mode: 'summary', uid: makeUid() },
          store: { counters },
        });
      } else {
        for (const input of checked) {
          await Homey.createDevice({
            name: input.dataset.name,
            data: { mode: 'individual', uid: makeUid() },
            store: { deviceId: input.dataset.deviceId, capability: input.dataset.capability },
          });
        }
      }
      Homey.done();
    } catch (err) {
      Homey.hideLoadingOverlay();
      Homey.alert(err.message || err);
    }
  });

  Homey.showLoadingOverlay();
  Homey.emit('list_counters', null)
    .then((result) => {
      Homey.hideLoadingOverlay();
      MODE = (result && result.mode) || 'individual';
      applyModeText();
      renderGroups(result && result.groups);
    })
    .catch((err) => {
      Homey.hideLoadingOverlay();
      Homey.alert(err.message || err);
    });
</script>
